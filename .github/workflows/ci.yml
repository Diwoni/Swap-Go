name: CI

# ============================================
# 트리거 조건: PR 생성/업데이트 시 또는 push 시 실행
# ============================================
on:
  pull_request:
    branches: [Main, Develop] # ⚠️ Main과 Develop으로 수정 (대소문자 일관성)
  push:
    branches: [Main, Develop]

# ============================================
# 동시 실행 제어
# - 같은 PR에서 새 커밋이 push되면 이전 실행 취소
# - 비용 절감 + 빠른 피드백
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # ??
  cancel-in-progress: true

# ============================================
# 환경 변수 (모든 Job에서 공통 사용)
# ============================================
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10' # package.json의 packageManager와 동기화

jobs:
  # ============================================
  # Job 1: Lint 및 포맷 체크
  # - ESLint로 코드 품질 검사
  # - Prettier로 포맷 일관성 검사
  # - TypeScript 타입 체크
  # ============================================
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃 (저장소 코드 가져오기)
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. pnpm 설치
      # - package.json의 packageManager 필드에서 버전 자동 감지
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      # 3. Node.js 설치 및 pnpm 캐시 설정
      # - cache: 'pnpm'으로 node_modules 캐싱 (빌드 속도 향상)
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # 4. 의존성 설치
      # - --frozen-lockfile: pnpm-lock.yaml 변경 방지 (CI에서 필수)
      # - npm ci와 동일한 역할
      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. ESLint 실행
      # - 코드 스타일 및 잠재적 버그 검사
      # - package.json의 "lint" 스크립트 실행
      - name: 🔍 Run ESLint
        run: pnpm run lint

      # 6. Prettier 포맷 체크
      # - 코드 포맷팅이 규칙에 맞는지 검사
      # - --check 옵션: 수정하지 않고 검사만
      - name: 💅 Check Prettier formatting
        run: pnpm run format:check

      # 7. TypeScript 타입 체크
      # - 타입 오류 검사 (빌드 전 확인)
      # - tsc --noEmit: 컴파일 없이 타입만 체크
      - name: 📘 TypeScript type check
        run: pnpm run type-check

  # ============================================
  # Job 2: 테스트 실행 및 커버리지 수집
  # - 유닛 테스트 실행
  # - 커버리지 리포트 생성
  # ============================================
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      # 테스트 실행 (CI 모드)
      # - 일반 watch 모드가 아닌 단일 실행
      # - 커버리지 리포트 생성
      - name: 🧪 Run tests
        run: pnpm run test:ci

      # Codecov에 커버리지 업로드 (선택사항)
      # - 테스트 커버리지 추적
      # - PR에 커버리지 변화 자동 코멘트
      # ⚠️ Codecov 사용 안 하면 이 부분 제거
      # - name: 📊 Upload coverage to Codecov
      #   if: always() # 테스트 실패해도 커버리지는 업로드
      #   uses: codecov/codecov-action@v3
      #   with:
      #     files: ./coverage/coverage-final.json
      #     fail_ci_if_error: false # 커버리지 업로드 실패해도 CI는 통과

  # ============================================
  # Job 3: 빌드
  # - lint와 test가 모두 통과해야 실행 (needs)
  # - 프로덕션 빌드 가능 여부 확인
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test] # lint와 test 성공 시에만 실행

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      # 프로덕션 빌드
      # - TypeScript 컴파일
      # - 번들링
      # - 최적화
      - name: 🏗️ Build project
        run: pnpm run build
        env:
          NODE_ENV: production

      # 빌드 결과물 크기 체크 (선택사항)
      # - 번들 크기가 임계값 초과 시 경고
      # ⚠️ .size-limit.json 파일 필요 (없으면 제거)
      # - name: 📏 Check bundle size
      #   if: github.event_name == 'pull_request'
      #   uses: andresz1/size-limit-action@v1
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     skip_step: install
      #     build_script: pnpm run build

  # ============================================
  # Job 4: PR 자동 코멘트 (선택사항)
  # - PR에 린트/테스트 결과 요약 코멘트
  # ============================================
  comment:
    name: 💬 PR Comment
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: 💬 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('CI Results')
            );

            const output = `## 🤖 CI Results

            ✅ Lint: ${{ needs.lint.result }}
            ✅ Tests: ${{ needs.test.result }}
            ✅ Build: ${{ needs.build.result }}

            ---
            *Automated comment by GitHub Actions*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }
